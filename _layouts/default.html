<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.data.site.name }}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sticky name + three pages; schedule is a dated ledger (date | talk | host/room), team a card grid, links a single narrow column. */
:root {
  /* Brand palette — swap these five for your institution's colors */
  --navy: #0C2340;
  --gold: #CBA052;
  --cyan: #00C1D5;
  --pink: #E10098;
  --sun:  #FFC845;

  --bg: #FFFFFF;
  --ombre: linear-gradient(165deg, #BFEFF5 0%, #F4FCFD 28%, #FFFFFF 45%, #FCE3F3 78%, #FFF1CC 100%);
  --surface: #FFFFFF;
  --fg: #0C2340;
  --muted: #4E5D73;
  --line: #DCE3EC;
  --accent: #0C2340;
  --accent-soft: #D9F6F9;
  --stain: #E10098;
  --stain-soft: #FDE8F6;
  --display: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C2340; --ombre: linear-gradient(165deg, #0A5873 0%, #0B3B5C 22%, #0C2340 48%, #3A1A4F 82%, #4A3A1C 100%); --surface: #14305A; --fg: #FFFFFF; --muted: #AEBBD0; --line: #27456F;
    --accent: #00C1D5; --accent-soft: #10405A; --stain: #FF5CC0; --stain-soft: #47123A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C2340; --ombre: linear-gradient(165deg, #0A5873 0%, #0B3B5C 22%, #0C2340 48%, #3A1A4F 82%, #4A3A1C 100%); --surface: #14305A; --fg: #FFFFFF; --muted: #AEBBD0; --line: #27456F;
  --accent: #00C1D5; --accent-soft: #10405A; --stain: #FF5CC0; --stain-soft: #47123A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg) var(--ombre) no-repeat; background-size: 100% 100%; color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.55; }
img { max-width: 100%; }
a { color: var(--accent); text-decoration-color: var(--cyan); text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--stain); outline-offset: 2px; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 55%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.topbar::after { content: ""; display: block; height: 5px; background: linear-gradient(90deg, var(--navy) 0 20%, var(--cyan) 20% 40%, var(--pink) 40% 60%, var(--sun) 60% 80%, var(--gold) 80% 100%); }
.topbar-inner, main, footer { max-width: 60rem; margin-inline: auto; padding-inline: 20px; }
.topbar-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding-block: 12px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.1rem; letter-spacing: -0.01em; }
.brand a { color: inherit; text-decoration: none; }
nav { display: flex; gap: 4px; }
nav a {
  text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.95rem;
  padding: 6px 12px; border-radius: 999px;
}
nav a:hover { color: var(--fg); }
nav a[aria-current="page"] { background: var(--accent); color: var(--bg); }

main { padding-block: 40px 64px; }
.kicker { font-family: var(--mono); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg); font-weight: 700; display: flex; align-items: center; gap: 10px; }
.kicker::before { content: ""; width: 28px; height: 4px; border-radius: 2px; background: var(--gold); }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1.02; letter-spacing: -0.03em; margin: 8px 0 16px; text-wrap: balance; }
.lede { max-width: 62ch; color: var(--muted); font-size: 1.08rem; margin: 0; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 24px 0 0; padding: 0; list-style: none; font-family: var(--mono); font-size: 0.85rem; font-weight: 600; }
.facts b { font-weight: 500; color: var(--muted); margin-right: 6px; }

.jump { display: flex; gap: 8px; margin-top: 28px; flex-wrap: wrap; }
.jump a { text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; color: var(--fg); background: var(--surface); }
.jump a:hover { border-color: var(--cyan); }

.semester { margin-top: 56px; scroll-margin-top: 90px; }
.semester h2, .page-h { font-family: var(--display); font-weight: 700; font-size: 1.7rem; letter-spacing: -0.02em; margin: 0; }
.semester-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 4px solid var(--cyan); }
.semester-head span { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); font-weight: 600; }

.talks { list-style: none; margin: 0; padding: 0; }
.talk { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr) 11rem; gap: 8px 24px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.talk > * { min-width: 0; }
.date { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; }
.date .day { font-size: 1.05rem; font-weight: 500; display: block; }
.date .dow { font-size: 0.78rem; color: var(--muted); }
.speaker { font-weight: 600; font-size: 1.08rem; margin: 0; }
.affil { color: var(--muted); font-size: 0.93rem; margin: 0; }
.title { margin: 6px 0 0; font-family: var(--display); font-weight: 600; font-size: 1.12rem; line-height: 1.3; }
.meta { font-size: 0.88rem; color: var(--muted); }
.meta div + div { margin-top: 2px; }
.tag { display: inline-block; font-family: var(--mono); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 999px; margin-bottom: 6px; }
.talk.next { background: var(--stain-soft); margin-inline: -14px; padding-inline: 14px; border-radius: 10px; border-bottom-color: transparent; }
.talk.next .tag { background: var(--stain); color: var(--bg); }
.talk.past { opacity: 0.55; }
.talk.past .tag { border: 1px solid var(--line); color: var(--muted); }
.talk.break .title { font-family: var(--body); font-size: 0.95rem; color: var(--muted); font-style: italic; margin: 0; }

.team { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: 24px; margin-top: 36px; }
.person { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 32px; display: flex; flex-direction: column; gap: 16px; }
.avatar { width: 128px; height: 128px; border-radius: 50%; background: var(--sun); color: var(--navy); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 2.4rem; position: relative; overflow: hidden; }
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.person h3 { margin: 0; font-size: 1.3rem; font-weight: 600; }
.role { font-family: var(--mono); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--stain); font-weight: 700; }
.person p { margin: 0; font-size: 1rem; color: var(--muted); }
.email { font-family: var(--mono); font-size: 0.9rem; overflow-wrap: anywhere; user-select: all; color: var(--fg); }

.links { max-width: 30rem; margin: 0 auto; text-align: center; }
.links .lede { margin-inline: auto; }
.links .kicker { justify-content: center; }
.linklist { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
.linklist a {
  display: block; text-decoration: none; text-align: left; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px;
  border-left: 5px solid var(--cyan);
  transition: transform 0.15s, border-color 0.15s;
}
.linklist a:nth-child(3n+2) { border-left-color: var(--pink); }
.linklist a:nth-child(3n) { border-left-color: var(--sun); }
.linklist a:hover { border-color: var(--cyan); transform: translateY(-2px); }
.linklist strong { display: block; font-weight: 600; }
.linklist span { font-size: 0.88rem; color: var(--muted); }

footer { padding-block: 24px 40px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.85rem; }

/* Hero with the next talk's flyer, composed from that talk's front matter.
   The card is a poster: its colors are the brand constants and do not
   change with the page theme. */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 20rem); gap: 32px 48px; align-items: start; }
.flyer { margin: 0; }
.flyer-label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--stain); margin-bottom: 8px; }
.flyer-card { display: flex; flex-direction: column; aspect-ratio: 8.5 / 11; background: var(--navy); color: #FFFFFF; border-radius: 12px; border: 1px solid var(--line); box-shadow: 0 14px 34px rgba(12, 35, 64, 0.18); overflow: hidden; }
.fc-banner { padding: 16px 20px 12px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 0.85rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sun); }
.fc-stripe { height: 5px; flex: none; background: linear-gradient(90deg, var(--gold) 0 20%, var(--cyan) 20% 40%, var(--pink) 40% 60%, var(--sun) 60% 80%, var(--gold) 80% 100%); }
.fc-body { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px 22px; text-align: center; }
.fc-photo { width: 42%; max-width: 160px; aspect-ratio: 1; border-radius: 50%; background: #14305A; border: 3px solid var(--gold); display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 2rem; color: var(--sun); position: relative; overflow: hidden; flex: none; }
.fc-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.fc-title { margin: 4px 0 0; font-family: var(--display); font-weight: 700; font-size: clamp(1.05rem, 2.4vw, 1.3rem); line-height: 1.25; text-wrap: balance; }
.fc-speaker { font-weight: 700; font-size: 1rem; color: var(--cyan); }
.fc-affil { font-size: 0.85rem; color: #AEBBD0; }
.fc-when { padding: 12px 20px; background: var(--sun); color: var(--navy); font-weight: 700; font-size: 0.9rem; text-align: center; font-variant-numeric: tabular-nums; }
.flyer-print { display: inline-block; margin-top: 10px; font-weight: 600; font-size: 0.9rem; }
.flyer-empty { aspect-ratio: 8.5 / 11; max-width: 100%; display: grid; place-items: center; text-align: center; padding: 20px; border: 2px dashed var(--cyan); border-radius: 12px; background: var(--surface); color: var(--muted); font-size: 0.95rem; }
@media (max-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr); } .flyer { max-width: 22rem; } }

@media (max-width: 640px) {
  .talk { grid-template-columns: 4.6rem minmax(0, 1fr); }
  .meta { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) { .linklist a { transition: none; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><a href="./">{{ site.data.site.name }}</a></div>
    <nav aria-label="Pages">
      <a href="./" {% if page.url == "/" %}aria-current="page"{% endif %}>Schedule</a>
      <a href="team.html" {% if page.url == "/team.html" %}aria-current="page"{% endif %}>Team</a>
      <a href="links.html" {% if page.url == "/links.html" %}aria-current="page"{% endif %}>Links</a>
    </nav>
  </div>
</header>

<main>
{{ content }}
</main>

<footer>{{ site.data.site.name }} · {{ site.data.site.year }} · Questions: <span class="email">{{ site.data.site.contact }}</span></footer>

</body>
</html>
